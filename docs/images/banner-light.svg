<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Nyx, a little AI buddy for your Omarchy desktop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf6fb"/><stop offset="1" stop-color="#f1e8f3"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8a2c8" stop-opacity="0.35"/><stop offset="1" stop-color="#e8a2c8" stop-opacity="0"/></radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c7df"/><stop offset="0.55" stop-color="#e8a2c8"/><stop offset="1" stop-color="#b47596"/></linearGradient>
    <clipPath id="r"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    
    <circle cx="430" cy="160" r="150" fill="url(#glow)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <circle cx="430" cy="160" r="66" fill="url(#orb)" stroke="#ffffff" stroke-opacity="0.2"/>
      <ellipse cx="404" cy="122" rx="20" ry="10" transform="rotate(-28 404 122)" fill="#ffffff" fill-opacity="0.45"/>
      <g fill="#13111c">
        <rect x="408" y="146" width="12" height="24" rx="6"><animate attributeName="height" values="24;24;2;24;24" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="146;146;157;146;146" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></rect>
        <rect x="440" y="146" width="12" height="24" rx="6"><animate attributeName="height" values="24;24;2;24;24" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="146;146;157;146;146" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></rect>
      </g>
      <circle cx="417" cy="151" r="2.6" fill="#ffffff" opacity="0.85"/>
      <circle cx="449" cy="151" r="2.6" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="398" cy="180" rx="8" ry="4" fill="#ff6f9f" opacity="0.35"/>
      <ellipse cx="462" cy="180" rx="8" ry="4" fill="#ff6f9f" opacity="0.35"/>
    </g>
    <text x="560" y="168" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="84" font-weight="700" fill="#1d1828" letter-spacing="-2">nyx</text>
    <text x="563" y="214" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="22" fill="#6c6480">a little AI buddy for your Omarchy desktop</text>
  </g>
</svg>
